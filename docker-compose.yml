services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dripl
      POSTGRES_PASSWORD: dripl
      POSTGRES_DB: dripl
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dripl -d dripl']
      interval: 5s
      timeout: 5s
      retries: 10

  http-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.http-server
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dripl:dripl@postgres:5432/dripl
      HTTP_PORT: 3002
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in the environment}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in the environment}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in the environment}
      # Optional distributed limiter/pubsub provider. The services fall back
      # to bounded process-local limiters when these are absent.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3002/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ws-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws-server
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dripl:dripl@postgres:5432/dripl
      WS_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in the environment}
      # Internal service address; never use localhost from inside a container.
      HTTP_SERVER_URL: http://http-server:3002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      http-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3001/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dripl-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dripl-app
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dripl:dripl@postgres:5432/dripl
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in the environment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Server-side BFF calls use the internal address; browser-facing values
      # remain localhost URLs so they work from the host.
      API_SERVER_URL: http://http-server:3002
      HTTP_SERVER_URL: http://http-server:3002
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      http-server:
        condition: service_healthy
      ws-server:
        condition: service_healthy

volumes:
  postgres_data:
