services:
  - type: web
    name: dripl-http-server
    env: node
    rootDir: apps/http-server
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @dripl/db db:generate && pnpm turbo run build --filter=http-server
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    # Liveness, not readiness, on purpose. Render restarts an instance that
    # fails consecutive checks for 60s, and `/health` here answers 503 when
    # Postgres is unreachable — so pointing the restart policy at it turns a
    # database blip into a process restart. `/live` performs no I/O and so
    # cannot fail for a reason a restart would fix. `/health` is unchanged and
    # remains the readiness signal for an operator or a load balancer.
    healthCheckPath: /live
    autoDeploy: true

  - type: web
    name: dripl-ws-server
    env: node
    rootDir: apps/ws-server
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @dripl/db db:generate && pnpm turbo run build --filter=ws-server
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: HTTP_SERVER_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
    # See the http-server service above. This one matters more: a restart here
    # discards the authoritative in-memory RoomState for every live room.
    healthCheckPath: /live
    autoDeploy: true
