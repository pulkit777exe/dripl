name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_LOG_ORDER: grouped
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: 'Lint (PR: affected / Main: full)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run lint --affected
          else
            pnpm turbo run lint
          fi
      - name: Check package boundaries
        run: pnpm boundaries
      - name: Check bundled servers have no relative imports
        # esbuild resolves every relative import at build time, so the bundle
        # must contain zero relative specifiers for Node to fail on. This is
        # the static replacement for the old check-esm gate: it guards the
        # exact ERR_MODULE_NOT_FOUND-on-boot class without needing a database.
        # (Full boot smoke lives in CONTRIBUTING.md and needs postgres.)
        run: |
          pnpm turbo run build --filter=ws-server --filter=http-server
          if grep -Eo "from['\"]\.[^'\"]*['\"]" apps/ws-server/dist/index.js apps/http-server/dist/index.js | head -5; then
            echo "bundled dist contains relative imports" >&2
            exit 1
          fi
          echo "no relative imports in server bundles"

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_LOG_ORDER: grouped
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: 'Build (PR: affected / Main: full)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run build --affected
          else
            pnpm turbo run build
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_LOG_ORDER: grouped
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: test-secret-for-ci
      RUN_DB_INTEGRATION: 'true'
      RUN_WS_INTEGRATION: 'true'
      # Enables production-db.test.ts, the two-client WebSocket suite that runs
      # against this job's real postgres service. Without it the suite skips and
      # CI would report green while never touching the database from the
      # collaboration path.
      RUN_WS_DB_INTEGRATION: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply database migrations
        run: pnpm --filter @dripl/db exec prisma migrate deploy
      - name: 'Test (PR: affected / Main: full)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run test --affected
          else
            pnpm turbo run test
          fi
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-for-ci

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_LOG_ORDER: grouped
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build packages (required for type resolution)
        run: pnpm turbo run build --filter=!dripl-app --filter=!http-server --filter=!ws-server
      - name: 'Type check (PR: affected / Main: full)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run check-types --affected
          else
            pnpm turbo run check-types
          fi
  production-e2e:
    name: Production stack E2E
    runs-on: ubuntu-latest
    # Catches the class of bug that unit tests cannot see: images that build
    # but die on boot, and browser behavior against the production artifact
    # (this job is what would have caught both the ERR_MODULE_NOT_FOUND
    # outage and the image-optimizer deadlock before release).
    needs: [build]
    env:
      JWT_SECRET: ci-jwt-secret-that-is-long-enough
      INTERNAL_SECRET: ci-internal-secret-that-is-long-enough
      # docker-compose.yml interpolates with ${VAR:?...}, so these two must
      # EXIST at `docker compose build` time or compose exits non-zero before
      # a single image is built. e2e/smoke.spec.ts only loads /, /signup and
      # /login and never completes a Google OAuth handshake, so labelled
      # non-secret placeholders are correct here — real credentials in CI would
      # be both unnecessary and a supply-chain hazard. Distinct from the two
      # secrets above: apps/http-server/src/env.ts rejects JWT_SECRET ===
      # INTERNAL_SECRET, and both secrets must stay >= 32 chars in production.
      GOOGLE_CLIENT_ID: ci-placeholder-not-a-real-oauth-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-not-a-real-oauth-client-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build images
        run: docker compose build
      - name: Boot stack and wait for health
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/health >/dev/null \
              && curl -fsS http://127.0.0.1:3001/health >/dev/null \
              && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=50
          exit 1
      - name: Install Playwright browser
        run: pnpm --filter dripl-app exec playwright install --with-deps chromium
      - name: Smoke test against the production stack
        # localhost, not 127.0.0.1: NEXT_PUBLIC_API_URL is baked into the image
        # as http://localhost:3002/api and the http-server CORS allowlist is
        # [FRONTEND_URL, NEXT_PUBLIC_APP_URL] = http://localhost:3000. A browser
        # on http://127.0.0.1:3000 sends a different Origin and every API call
        # is rejected, so the page renders but can never talk to its own API.
        run: E2E_BASE_URL=http://localhost:3000 pnpm --filter dripl-app test:e2e e2e/smoke.spec.ts
      - name: Tear down
        if: always()
        run: docker compose down -v
